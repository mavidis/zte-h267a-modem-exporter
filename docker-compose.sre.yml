version: '3.8'

# İsteğe bağlı ek servisler: disk SMART sağlık izleme ve ev/homelab SRE
# yedekleme metrikleri. Bu servisler ZTE modem exporter'ının bir parçası
# değildir; belirli bir sunucudaki disk aygıtlarına ve yedekleme
# dizinlerine bağımlıdır. Başka bir makinede kullanmadan önce aşağıdaki
# ortam değişkenlerini kendi sisteminize göre ayarlayın (bkz. .env.example).
#
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.sre.yml up -d

services:
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    restart: unless-stopped
    user: root
    # SG_IO ATA passthrough (SMART verisi) için gerekli; smartctl her zaman
    # root ister. --device + bu iki capability yeterli, privileged: true
    # gerekmiyor.
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    # Host'taki disklere göre güncelleyin: lsblk -dn -o NAME
    devices:
      - ${SMARTCTL_DEVICE_1:-/dev/sda}:${SMARTCTL_DEVICE_1:-/dev/sda}
      - ${SMARTCTL_DEVICE_2:-/dev/sdb}:${SMARTCTL_DEVICE_2:-/dev/sdb}
      - ${SMARTCTL_DEVICE_3:-/dev/nvme0}:${SMARTCTL_DEVICE_3:-/dev/nvme0}
    command:
      - --smartctl.device=${SMARTCTL_DEVICE_1:-/dev/sda}
      - --smartctl.device=${SMARTCTL_DEVICE_2:-/dev/sdb}
      - --smartctl.device=${SMARTCTL_DEVICE_3:-/dev/nvme0}
    ports:
      - "9633:9633"

  sre-backup-exporter:
    build:
      context: ./sre_exporter
      dockerfile: Dockerfile
    container_name: sre-backup-exporter
    restart: unless-stopped
    ports:
      - "9878:9878"
    volumes:
      - ${SRE_METRICS_DIR:-/home/ccakar/metrics}:/metrics_data:ro
      - ${SRE_BACKUP_DISK_PATH:-/mnt/IronWolf}:/mnt/IronWolf:ro
