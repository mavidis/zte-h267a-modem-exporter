version: '3.8'

services:
  modem-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modem-exporter
    restart: unless-stopped
    ports:
      - "9877:9877"
    environment:
      - MODEM_HOST=${MODEM_HOST:-192.168.123.1}
      - MODEM_USER=${MODEM_USER:-admin}
      - MODEM_PASSWORD=${MODEM_PASSWORD:?MODEM_PASSWORD is required, set it in .env}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-30}
      - MODEM_TIMEOUT=${MODEM_TIMEOUT:-10}

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # Varsayılan 15 günden uzatıldı: çevre AP (rogue AP) taramasında zamanla
      # ortaya çıkabilecek paternleri (günlük/haftalık trafik döngüleri vb.)
      # görebilmek için birkaç haftalık/aylık geçmiş gerekiyor.
      - "--storage.tsdb.retention.time=90d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./disk_backup_alert_rules.yml:/etc/prometheus/disk_backup_alert_rules.yml:ro
      - ./rogueap_recording_rules.yml:/etc/prometheus/rogueap_recording_rules.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
