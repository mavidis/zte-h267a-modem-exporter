global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "alert_rules.yml"
  - "disk_backup_alert_rules.yml"

scrape_configs:
  - job_name: 'zte-modem'
    static_configs:
      - targets: ['modem-exporter:9877']

  # smartctl-exporter ve sre-backup-exporter, mavidis/sre-homelab-monitoring
  # deposundan bu sunucuda çalıştırılan ayrı, host'a özel servislerdir
  # (bkz. o depodaki docker-compose.yml). Bu iki job ve
  # disk_backup_alert_rules.yml, o depodaki içerikle senkron tutulmalıdır.
  - job_name: 'smartctl-exporter'
    static_configs:
      - targets: ['smartctl-exporter:9633']

  - job_name: 'sre-backup'
    static_configs:
      - targets: ['sre-backup-exporter:9878']
