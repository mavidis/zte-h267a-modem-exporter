global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'zte-modem'
    static_configs:
      - targets: ['modem-exporter:9877']

  # Aşağıdaki iki hedef isteğe bağlıdır (bkz. docker-compose.sre.yml).
  # Bu katman çalıştırılmıyorsa Prometheus'ta "down" görünürler; bu zararsızdır.
  - job_name: 'smartctl-exporter'
    static_configs:
      - targets: ['smartctl-exporter:9633']

  - job_name: 'sre-backup'
    static_configs:
      - targets: ['sre-backup-exporter:9878']
